# Builds a SIGNED release Android App Bundle (.aab) for the Play Store, entirely
# in CI — so no local Flutter/Android toolchain is needed.
#
# ── One-time setup: add these repo secrets (Settings → Secrets → Actions) ─────
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks). Generate with:
#                               base64 -i ~/vidyatrack-upload-keystore.jks | pbcopy
#   ANDROID_KEYSTORE_PASSWORD store password for the keystore
#   ANDROID_KEY_PASSWORD      key password (often same as the store password)
#   ANDROID_KEY_ALIAS         key alias — for this project: upload
#   PLAY_SERVICE_ACCOUNT_JSON (optional) Google Play service-account JSON, only
#                             needed for the "publish" job described below.
#
# ── How to run ────────────────────────────────────────────────────────────────
#   • Actions tab → "Android Release (Play Store)" → Run workflow, OR
#   • push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   Either way the signed .aab is attached to the run as "vidyatrack-release-aab".
#
# ── First Play Store release ────────────────────────────────────────────────────
#   Google requires the FIRST upload of a brand-new app to go through the Play
#   Console UI (it registers the package name). So: download the artifact and
#   upload it by hand the first time. After that, the optional "publish" job can
#   push future builds to a testing track via the API — set publish_to_play to
#   internal / alpha / beta when running (never production from CI).

name: Android Release (Play Store)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'versionCode override (blank = use pubspec version, e.g. 1.0.0+1 → 1)'
        required: false
        default: ''
      publish_to_play:
        description: 'After building, upload the .aab to a Play track (or just keep the artifact)'
        required: true
        default: 'none'
        type: choice
        options: [none, internal, alpha, beta]
  push:
    tags: ['v*']

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'
  PACKAGE_NAME: com.vidyatrack.vidyatrack

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64 — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "Keystore decoded ($(wc -c < "$RUNNER_TEMP/upload-keystore.jks") bytes)."

      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n'   "$KEY_PASSWORD"
            printf 'keyAlias=%s\n'      "$KEY_ALIAS"
            printf 'storeFile=%s\n'     "$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release App Bundle
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            EXTRA="--build-number=${{ github.event.inputs.build_number }}"
          fi
          flutter build appbundle --release $EXTRA

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidyatrack-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Upload to Google Play (${{ github.event.inputs.publish_to_play }})
    needs: build
    # Only on a manual run that explicitly chose a track. Tag pushes never publish.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_play != 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download .aab artifact
        uses: actions/download-artifact@v4
        with:
          name: vidyatrack-release-aab
          path: .

      - name: Upload to Play ${{ github.event.inputs.publish_to_play }} track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app-release.aab
          track: ${{ github.event.inputs.publish_to_play }}
          status: draft   # stays a draft in the console — you promote it manually
