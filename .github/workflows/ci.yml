name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  FLUTTER_VERSION: '3.22.0'

jobs:
  # ── NestJS API ──────────────────────────────────────────────────────────────
  api:
    name: API — lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vidyatrack
          POSTGRES_PASSWORD: vidyatrack
          POSTGRES_DB: vidyatrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 3

    env:
      DATABASE_URL: postgresql://vidyatrack:vidyatrack@localhost:5432/vidyatrack_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_at_least_32_chars_long!
      JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars!
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run schema
        run: |
          PGPASSWORD=vidyatrack psql -h localhost -U vidyatrack -d vidyatrack_test -f src/database/schema.sql

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --coverage

      - name: RLS isolation e2e test
        run: npm run test:e2e --if-present

  # ── Next.js web ─────────────────────────────────────────────────────────────
  web:
    name: Web — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1

  # ── Flutter mobile ──────────────────────────────────────────────────────────
  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build APK (debug)
        run: flutter build apk --debug --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker — compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build --no-cache
